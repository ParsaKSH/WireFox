version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # 0.13 needs Rust 1.95, above our MSRV (1.88).
      - dependency-name: parking_lot
        versions: [">= 0.13"]
