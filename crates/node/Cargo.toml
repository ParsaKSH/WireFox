[package]
name = "wirefox-node"
description = "WireFox exit-node: reverse-tunnels to the server and sends traffic out of a chosen interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
wirefox-common.workspace = true
anyhow.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-rustls.workspace = true
socket2.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
clap = { workspace = true, features = ["env"] }
tracing.workspace = true
parking_lot.workspace = true
rand.workspace = true
tracing-subscriber.workspace = true
mimalloc = { workspace = true, optional = true }
if-addrs = "0.15"
base64 = "0.22"
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.14"
tokio-stream = { version = "0.1", default-features = false }
tonic = { version = "0.14", default-features = false, features = ["codegen", "channel"] }
tonic-prost = "0.14"
tower = { version = "0.5", default-features = false, features = ["util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[build-dependencies]
protox = "0.10"
tonic-prost-build = "0.14"

[dev-dependencies]
rcgen.workspace = true
tonic = { version = "0.14", default-features = false, features = ["server", "tls-connect-info"] }

[features]
default = ["mimalloc"]
