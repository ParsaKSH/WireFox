[package]
name = "wirefox-server"
description = "WireFox server: SOCKS5 front end, tunnel hub for exit-nodes, and control API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
wirefox-common.workspace = true
anyhow.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
hex.workspace = true
clap.workspace = true
tracing.workspace = true
parking_lot.workspace = true
mimalloc = { workspace = true, optional = true }
axum = { version = "0.8", default-features = false, features = ["json", "query", "http1", "tokio"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "timeout"] }
argon2 = "0.6"
rpassword = "7"

[features]
default = ["mimalloc"]

[dev-dependencies]
wirefox-node.workspace = true
